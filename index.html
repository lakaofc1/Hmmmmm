<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LashxBot - QR Session Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; border-radius: 20px; padding: 35px 25px; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #0284c7; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0ea5e9; }
        #qr-box { margin-top: 25px; display: none; background: #ffffff; padding: 15px; border-radius: 16px; width: fit-content; margin-left: auto; margin-right: auto; }
        #qr-img { width: 230px; height: 230px; display: block; }
        .info-text { margin-top: 20px; font-size: 13px; color: #cbd5e1; line-height: 1.5; }
        .loading { color: #fbbf24; font-size: 15px; margin-top: 20px; }
        .error { color: #f87171; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>LashxBot QR Generator</h2>
        <p class="subtitle">Scan the QR code using iPhone to get your Session ID</p>

        <button onclick="generateQR()">Get QR Code</button>

        <div id="status"></div>

        <div id="qr-box">
            <img id="qr-img" src="" alt="WhatsApp QR Code">
        </div>

        <div id="info" class="info-text" style="display: none;">
            Open <b>WhatsApp Settings -> Linked Devices -> Link a Device</b> and scan this QR code.<br><br>
            <i>Once scanned, your Session ID will be sent directly to your WhatsApp chat!</i>
        </div>
    </div>

    <script>
        async function generateQR() {
            const statusDiv = document.getElementById('status');
            const qrBox = document.getElementById('qr-box');
            const qrImg = document.getElementById('qr-img');
            const infoDiv = document.getElementById('info');

            statusDiv.innerHTML = '<div class="loading">Generating QR Code, please wait...</div>';
            qrBox.style.display = 'none';
            infoDiv.style.display = 'none';

            try {
                const response = await fetch('/qr');
                const data = await response.json();

                if (data.success && data.qr) {
                    statusDiv.innerHTML = '';
                    qrImg.src = data.qr;
                    qrBox.style.display = 'block';
                    infoDiv.style.display = 'block';
                } else {
                    statusDiv.innerHTML = `<div class="error">Error: ${data.message || 'Failed to get QR Code'}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = '<div class="error">Server Connection Failed!</div>';
            }
        }
    </script>
</body>
</html>
